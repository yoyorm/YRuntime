# YRuntime CI
#
# 概念：workflow = 这个文件；job = 一台虚拟机上的一组步骤；step = 一条命令。
# 任何 step 退出码非 0 → 该 job 失败 → commit 上显示红叉。
# **CI 本身不做任何判断，它只是按顺序跑命令然后看退出码** —— 所以任何遵守
# "没问题退出 0 / 有问题退出非 0" 的工具都能当门禁。
#
# 两个 job：
#   build-test —— matrix 展开成 6 个并行虚拟机（2 编译器 × 3 构建类型），跑构建与测试
#   lint       —— 纯静态检查（格式 + 架构），不需要编译器，约 30 秒

name: CI

on: push

# 同一分支上新的 push 会取消还在跑的旧运行。
# 迭代时你会连续 push 好几次，没必要让每次都占 6 台机器跑完。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} · ${{ matrix.preset }}
    runs-on: ubuntu-24.04        # 钉死版本，与本机 Mint 22.3 同基座（noble），见 ADR D12

    strategy:
      # 默认 fail-fast: true 会在任一组合失败时取消其余组合，
      # 你就看不到"是只有 clang 挂了还是全挂了"。诊断期一律关掉。
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc,   cc: gcc-13,   cxx: g++-13,     apt: g++-13 }
          - { name: clang, cc: clang-18, cxx: clang++-18,  apt: clang-18 }
        preset: [debug, release, asan]

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # libcatch2-dev 在 Ubuntu 24.04 的 apt 源里不存在（2026-09-22 实测退出码 100），
      # 所以容错：装不到就让 tests/CMakeLists.txt 走 FetchContent。
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.apt }}
          sudo apt-get install -y libcatch2-dev \
            || echo "::warning::apt 无 libcatch2-dev，CMake 将用 FetchContent 拉取 Catch2 v3.7.1"

      # -D 覆盖 preset 里的值：CI 严格（警告即错误），本地宽松。
      # 不做成单独的 ci preset，避免 preset 数量翻倍。
      # 注意 CMake 的 cache 是粘的 —— 本地试过这个 -D 之后要显式改回 OFF 或删构建目录。
      - name: 配置
        run: cmake --preset ${{ matrix.preset }} -DYR_WARNINGS_AS_ERRORS=ON

      - name: 构建
        run: cmake --build --preset ${{ matrix.preset }}

      - name: 测试
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: 静态检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # clang-format 的大版本必须与本地一致（本机 18.1.3）：
      # 不同版本的格式化结果不同，不一致会导致"本地合规、CI 报错"。
      - name: 安装 clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      # -z/-0 配对处理含空格的文件名；-r 保证匹配为空时不执行
      # （否则 clang-format 会去读 stdin 然后永远卡住）。
      - name: 格式检查
        run: git ls-files -z '*.h' '*.cpp' | xargs -0 -r clang-format-18 --dry-run -Werror

      - name: 架构门禁（依赖方向 / 裸 new-delete / 图形 API 泄漏）
        run: python3 tools/check_deps.py --verbose
