# YRuntime CI

name: CI

on: push

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} · ${{ matrix.preset }}
    runs-on: ubuntu-24.04        # 钉死版本，与本机 Mint 22.3 同基座（noble）

    strategy:
      # 默认 fail-fast: true 会在任一组合失败时**取消其余组合**，
      # 你就看不到"是只有 clang 挂了还是全挂了"。诊断期一律关掉。
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc,   cc: gcc-13,   cxx: g++-13,     apt: g++-13 }
          - { name: clang, cc: clang-18, cxx: clang++-18,  apt: clang-18 }
        preset: [debug, release, asan]

    # 让 CMake 在 configure 时选中 matrix 指定的编译器
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # libcatch2-dev 在 Ubuntu 24.04 的 apt 源里不存在（2026-09-22 实测退出码 100），
      # 所以容错：装不到就让 tests/CMakeLists.txt 走 FetchContent。
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.apt }}
          sudo apt-get install -y libcatch2-dev \
            || echo "::warning::apt 无 libcatch2-dev，CMake 将用 FetchContent 拉取 Catch2 v3.7.1"

      - name: 配置
        run: cmake --preset ${{ matrix.preset }}

      - name: 构建
        run: cmake --build --preset ${{ matrix.preset }}

      - name: 测试
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: 架构门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 依赖方向 / 裸 new-delete / 图形 API 泄漏
        run: python3 tools/check_deps.py --verbose
